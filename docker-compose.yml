version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: music-genre-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-musicdet}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-musicdet}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music-genre-classifier
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENABLE_VECTOR_DB=${ENABLE_VECTOR_DB:-true}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-128}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/musicdet}
    volumes:
      - ./model:/app/model:ro
      - ./genre_mapping.json:/app/genre_mapping.json:ro
      - ./temp:/app/temp
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  # Optional: Development service with hot reload
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music-genre-classifier-dev
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - APP_ENV=development
      - DEBUG=true
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - LOG_LEVEL=DEBUG
      - ENABLE_VECTOR_DB=${ENABLE_VECTOR_DB:-true}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-128}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/musicdet}
    volumes:
      - .:/app
      - ./model:/app/model
      - ./temp:/app/temp
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    profiles:
      - dev
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
