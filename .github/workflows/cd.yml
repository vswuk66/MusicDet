# =============================================================================
# CD Pipeline - Continuous Deployment
# =============================================================================
# Этот workflow собирает и публикует Docker образ в реестры.
# Запускается при push в main/master или при создании релиза.
#
# Что делает:
# 1. Собирает Docker образ
# 2. Пушит в GitHub Container Registry (ghcr.io)
# 3. Опционально пушит в Docker Hub (если настроены секреты)
#
# Необходимые секреты (Settings -> Secrets and variables -> Actions):
# - DOCKERHUB_USERNAME: имя пользователя Docker Hub (опционально)
# - DOCKERHUB_TOKEN: токен доступа Docker Hub (опционально)
# =============================================================================

name: CD

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]  # При создании тега версии (v1.0.0, v2.1.3, etc.)
  
  # Позволяет запустить workflow вручную из GitHub UI
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: 'Push to registry'
        required: true
        default: 'true'
        type: boolean

env:
  # Имя образа для GitHub Container Registry
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  # Имя образа для Docker Hub (замени на своё)
  DOCKERHUB_IMAGE: ${{ github.repository_owner }}/music-genre-classifier

jobs:
  # ===========================================================================
  # Job 1: Сборка и публикация Docker образа
  # ===========================================================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    
    # Разрешения для работы с пакетами и токенами
    permissions:
      contents: read
      packages: write  # Для push в ghcr.io
    
    steps:
      # Шаг 1: Скачать код
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Шаг 2: Настроить Docker Buildx
      # Buildx - расширенный билдер с поддержкой кэширования и мультиплатформенности
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Шаг 3: Войти в GitHub Container Registry
      # Используем встроенный GITHUB_TOKEN - не нужно создавать отдельный секрет
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # Шаг 4: Войти в Docker Hub (опционально)
      # Пропускается если секреты не настроены
      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true
      
      # Шаг 5: Извлечь метаданные для тегов
      # Автоматически создаёт теги на основе веток и версий
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
          # Правила создания тегов:
          tags: |
            # При push в main -> тег "latest"
            type=raw,value=latest,enable={{is_default_branch}}
            # При создании тега v1.2.3 -> теги "1.2.3", "1.2", "1"
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Тег с SHA коммита для отладки
            type=sha,prefix=sha-
            # Тег с именем ветки
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=Music Genre Classifier
            org.opencontainers.image.description=AI-powered music genre classification
            org.opencontainers.image.vendor=${{ github.repository_owner }}
      
      # Шаг 6: Собрать и запушить образ
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Кэширование для ускорения сборки
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Платформы (можно добавить arm64 для M1/M2 Mac)
          platforms: linux/amd64
      
      # Шаг 7: Вывести информацию о собранном образе
      - name: Image digest
        run: |
          echo "## Docker Image Built Successfully! 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.GHCR_IMAGE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull the image:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.GHCR_IMAGE }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job 2: Уведомление о деплое (опционально)
  # ===========================================================================
  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: build-and-push
    if: always()  # Запустить даже если предыдущий job упал
    
    steps:
      - name: Create deployment summary
        run: |
          if [ "${{ needs.build-and-push.result }}" == "success" ]; then
            echo "## ✅ Deployment Successful!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Docker image has been built and pushed to the registry." >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please check the logs for more details." >> $GITHUB_STEP_SUMMARY
          fi
