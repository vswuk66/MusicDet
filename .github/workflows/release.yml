# =============================================================================
# Release Pipeline - Автоматическое создание релизов
# =============================================================================
# Этот workflow автоматически создаёт GitHub Release при push тега версии.
# 
# Как использовать:
# 1. Обнови версию в pyproject.toml
# 2. Создай и запуши тег: 
#    git tag v1.2.3
#    git push origin v1.2.3
# 3. Workflow автоматически создаст релиз с changelog
#
# Формат тегов: v1.0.0, v1.2.3, v2.0.0-beta.1
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Срабатывает на теги вида v1.0.0

jobs:
  # ===========================================================================
  # Job 1: Создание GitHub Release
  # ===========================================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Для создания релиза
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Получить всю историю для changelog
      
      # Извлечь версию из тега
      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      # Сгенерировать changelog из коммитов
      - name: Generate changelog
        id: changelog
        run: |
          # Получить предыдущий тег
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREVIOUS_TAG" ]; then
            # Если предыдущего тега нет, взять все коммиты
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            # Коммиты между предыдущим тегом и текущим
            COMMITS=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          
          # Сохранить в файл (для многострочного вывода)
          echo "$COMMITS" > changelog.txt
          
          # Категоризировать изменения
          echo "## What's Changed" > release_notes.md
          echo "" >> release_notes.md
          
          # Features
          FEATURES=$(echo "$COMMITS" | grep -iE "^- (feat|feature|add)" || true)
          if [ -n "$FEATURES" ]; then
            echo "### ✨ New Features" >> release_notes.md
            echo "$FEATURES" >> release_notes.md
            echo "" >> release_notes.md
          fi
          
          # Fixes
          FIXES=$(echo "$COMMITS" | grep -iE "^- (fix|bug|patch)" || true)
          if [ -n "$FIXES" ]; then
            echo "### 🐛 Bug Fixes" >> release_notes.md
            echo "$FIXES" >> release_notes.md
            echo "" >> release_notes.md
          fi
          
          # Docs
          DOCS=$(echo "$COMMITS" | grep -iE "^- (doc|readme)" || true)
          if [ -n "$DOCS" ]; then
            echo "### 📚 Documentation" >> release_notes.md
            echo "$DOCS" >> release_notes.md
            echo "" >> release_notes.md
          fi
          
          # Other
          OTHER=$(echo "$COMMITS" | grep -viE "^- (feat|feature|add|fix|bug|patch|doc|readme)" || true)
          if [ -n "$OTHER" ]; then
            echo "### 🔧 Other Changes" >> release_notes.md
            echo "$OTHER" >> release_notes.md
            echo "" >> release_notes.md
          fi
          
          # Docker image info
          echo "### 🐳 Docker" >> release_notes.md
          echo "" >> release_notes.md
          echo "Pull the Docker image:" >> release_notes.md
          echo "\`\`\`bash" >> release_notes.md
          echo "docker pull ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.version }}" >> release_notes.md
          echo "\`\`\`" >> release_notes.md
      
      # Создать релиз
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "Release ${{ steps.get_version.outputs.tag }}"
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.version, '-') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # Job 2: Публикация в PyPI (опционально)
  # ===========================================================================
  # Раскомментируй этот job если хочешь публиковать пакет в PyPI
  # Нужно добавить секрет PYPI_API_TOKEN
  
